name: CI

# Um PR roda UMA vez (pull_request). Push só dispara na main (o merge), para não
# pagar o mesmo CI duas vezes por branch de PR — economiza metade dos minutos
# gratuitos do Actions. Sem cota no Actions, o gate é o scripts/ci-local.sh
# (ver docs/CI_LOCAL.md), que reproduz estes mesmos jobs.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # 0) Segredos no histórico inteiro (gitleaks, MIT). Falsos-positivos triados em
  #    .gitleaksignore; achado real = rotacionar o segredo. Versão e SHA-256 fixos.
  segredos:
    name: segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks 8.30.1 (checksum conferido)
        run: |
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks && sudo mv gitleaks /usr/local/bin/
      - name: Segredos no histórico
        run: gitleaks git . --redact --no-banner --log-level warn --gitleaks-ignore-path .gitleaksignore

  # 0b) CVE ALTA/CRÍTICA das dependências (Trivy, Apache-2.0) + SBOM. Linha de base
  #     com vencimento em .trivyignore. Versão e SHA-256 fixos.
  dependencias:
    name: dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar trivy 0.75.0 (checksum conferido)
        run: |
          curl -sSfL -o tv.tgz https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  tv.tgz" | sha256sum -c -
          tar -xzf tv.tgz trivy && sudo mv trivy /usr/local/bin/
      - name: CVE ALTA/CRÍTICA nas dependências
        run: trivy fs . --scanners vuln --skip-dirs "**/node_modules" --skip-dirs android --skip-dirs _arquivo-antigo --quiet --severity HIGH,CRITICAL --ignorefile .trivyignore --exit-code 1
      - name: SBOM CycloneDX
        run: trivy fs . --scanners vuln --skip-dirs "**/node_modules" --skip-dirs android --skip-dirs _arquivo-antigo --quiet --format cyclonedx --output sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  # 1) App (raiz): o mesmo preflight que governa a release local.
  app-gate:
    name: app-gate
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # scripts/teste-*.ts rodam via `node arquivo.ts` direto, usando o type
      # stripping nativo do Node — recurso que só existe a partir do Node 22.
      # Em Node 20 esses testes quebram de cara com "Unknown file extension
      # .ts", então este job (só ele) sobe em 22 em vez dos 20 dos outros.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Instalar dependências (npm ci — package-lock.json na raiz)
        run: npm ci

      # Não separar typecheck/teste aqui: o preflight roda `npm test` e também
      # fecha lint (catraca), contraste, Doctor, config de release e o
      # meta-teste que garante que todo teste novo está ligado ao gate. Assim
      # um futuro Git/Cloudflare build não pode ficar verde só porque executou
      # um subconjunto antigo da suíte.
      - name: Preflight completo
        run: npm run preflight

  # 2) Painel (webapp/): build de produção (tsc && vite build) — pega erro de tipo.
  painel:
    name: painel
    runs-on: ubuntu-latest
    continue-on-error: false
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # O painel importa tipos/serviços compartilhados da raiz. Node 22
          # atende o type stripping usado pelo app e o Vite do painel.
          node-version: '22'

      - name: Instalar dependências compartilhadas do app
        working-directory: .
        run: npm ci

      # O painel importa web/src/data/planos.ts. Ao transformar esse arquivo, o
      # Vite resolve também web/tsconfig.json, que estende astro/tsconfigs/strict.
      - name: Instalar dependências compartilhadas da landing
        working-directory: web
        run: npm ci

      # webapp/ declara "packageManager": "pnpm@10.8.0" e mantém um único
      # lockfile canônico: pnpm-lock.yaml. Isso evita árvores diferentes entre
      # desenvolvimento, CI e o artefato publicado.
      - name: Enable Corepack
        run: corepack enable

      - name: Instalar dependências (pnpm — pnpm-lock.yaml em webapp/)
        run: pnpm i --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Testes puros do painel (sem DOM/rede). Até 29/09 este script só
      # declarava a função e saía com 0 — nunca tinha rodado de verdade.
      - name: Testes do painel
        run: pnpm run test:importacao

      # Orçamento de bundle: mede o gzip do JS/CSS crítico e do JS total do build
      # acima e falha se passar do teto em webapp/orcamento-bundle.json.
      - name: Orçamento de bundle do painel
        run: pnpm run test:bundle

  # 3) Landing (web/): astro check (type-check) + build.
  landing:
    name: landing
    runs-on: ubuntu-latest
    continue-on-error: false
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Astro 7 exige Node >=22.12; Node 20 faz o check abortar antes
          # mesmo de ler o projeto.
          node-version: '22'

      # A configuração da landing alcança tipos compartilhados cuja tsconfig
      # raiz estende expo/tsconfig.base.
      - name: Instalar dependências compartilhadas do app
        working-directory: .
        run: npm ci

      - name: Instalar dependências (npm ci — package-lock.json em web/)
        run: npm ci

      - name: Astro check
        run: npx astro check

      - name: Build
        run: npm run build

  # 4) Worker Cloudflare: bindings gerados + bundle de deploy sem publicação.
  worker:
    name: worker
    runs-on: ubuntu-latest
    continue-on-error: false
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm ci

      - name: Conferir tipos dos bindings
        run: |
          npm run types
          npm run types:check

      - name: Testes do Worker
        run: npm test

      - name: Validar bundle sem publicar
        run: npm run check

  # 5) Lint + gate de código limpo (MF-07): Biome com catraca, ruff, pyright,
  # semgrep e a config do pre-commit. O Biome reprova só erro NOVO — os 173 + 58
  # erros de 29/09 estão congelados em scripts/lint-base.json. Também roda dentro
  # do preflight; o job separado existe para o PR mostrar "lint" com nome próprio.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # O Biome (versão cravada, a mesma do painel) vem do package-lock.json
      # da raiz; o painel não precisa das próprias dependências para o lint.
      - name: Instalar dependências (npm ci — package-lock.json na raiz)
        run: npm ci

      - name: Instalar uv 0.13.5 (checksum conferido)
        run: |
          curl -sSfL -o uv.tgz https://github.com/astral-sh/uv/releases/download/0.13.5/uv-x86_64-unknown-linux-gnu.tar.gz
          echo "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f  uv.tgz" | sha256sum -c -
          tar -xzf uv.tgz
          sudo mv uv-x86_64-unknown-linux-gnu/uv uv-x86_64-unknown-linux-gnu/uvx /usr/local/bin/

      # Biome (catraca) + ruff + pyright + semgrep + pre-commit. O script
      # reprova se a ferramenta não rodar. Versões cravadas dentro dele.
      - name: Gate de código limpo (ruff, biome, pyright, semgrep, pre-commit)
        run: bash scripts/gate-codigo-limpo.sh
