<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Título do PAINEL (área logada). A frase de marketing é da landing; aqui o
         usuário já é cliente e o que ajuda é identificar a aba. -->
    <title>OLLI — Painel</title>
    <meta name="robots" content="noindex, nofollow" />
    <script>
      // Tema antes da primeira pintura. A rolagem nativa nasce branca se o
      // color-scheme só chega depois do React. Lê a preferência já salva
      // (zustand, chave "settings") e não inventa tema.
      (function () {
        try {
          var bruto = localStorage.getItem("settings");
          if (!bruto) return;
          var salvo = JSON.parse(bruto);
          var modo = salvo && salvo.state && salvo.state.settings && salvo.state.settings.themeMode;
          if (modo !== "dark" && modo !== "light") return;
          var raiz = document.documentElement;
          raiz.setAttribute("data-theme-mode", modo);
          raiz.style.colorScheme = modo;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
